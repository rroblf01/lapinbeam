version: 2
updates:
  # Python runtime + dev/docs dependencies pinned in pyproject.toml's
  # [dependency-groups] (PEP 735). Dependabot picks these up automatically;
  # PRs are grouped per-week to keep noise low.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-deps:
        patterns:
          - "*"

  # Rust dependencies pinned in Cargo.toml/Cargo.lock (pyo3, tokio, serde,
  # bincode, ...).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-deps:
        patterns:
          - "*"

  # GitHub Actions versions (uses: actions/checkout@vN, etc.). Pin
  # bumps land alongside ecosystem-wide security advisories.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
