name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on the same branch/PR supersedes whatever CI run is already in
# flight for it — cancel the stale one instead of burning minutes on results
# nobody will read. Different branches/PRs get their own group, so they never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build extension and install deps
        run: uv sync
        env:
          PYO3_PYTHON: python3
      - name: Run Python tests
        run: uv run pytest

  # Same as `test` above, but on macOS and Windows, with a reduced Python
  # matrix (oldest + newest supported) rather than all four versions — the
  # full matrix already runs on Linux; this is about catching genuine
  # platform differences (socket behavior, path handling, ...), not
  # re-checking every Python version on every OS.
  test-cross-platform:
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: macos-15-intel # Intel (x86_64)
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build extension and install deps
        run: uv sync
      - name: Run Python tests
        run: uv run pytest
      - name: Run Rust tests
        run: cargo test

  # Rust results don't depend on the Python version, so this runs once
  # instead of once per matrix entry above.
  rust-checks:
    name: rust fmt/clippy/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test
        env:
          PYO3_PYTHON: python3

  # mypy only needs to read lapinbeam/'s source + its _core.pyi stub, not the
  # compiled extension — no Rust toolchain or `uv sync` build needed here.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: mypy
        run: uv run --with mypy --no-project -- mypy lapinbeam/

  build-wheels:
    name: build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build abi3 wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Builds and strict-validates the docs on every push/PR — a broken doc
  # link or i18n config used to only surface after merging to main, since
  # `mkdocs build` only ever ran as part of the deploy-to-Pages job below.
  docs-validate:
    name: build & validate docs
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install docs dependencies
        run: uv sync --group docs
      - name: Build site
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  docs-deploy:
    name: deploy docs
    needs: [docs-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-e2e:
    name: docker compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start two-node cluster
        run: docker compose up -d
      - name: Verify 100/100 ACKs in node_a logs
        run: |
          for i in $(seq 1 60); do
            if docker logs lapinbeam_node_a 2>&1 | grep -q "Total: 100"; then
              echo "E2E OK: node_a received 100 ACKs"
              exit 0
            fi
            sleep 2
          done
          echo "E2E FAILED: node_a did not receive 100 ACKs"
          docker logs lapinbeam_node_a
          docker logs lapinbeam_node_b
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down

  docker-e2e-secure:
    name: docker compose e2e (cluster_secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose -f docker-compose.secure.yml build
      - name: Start two-node cluster with a matching cluster_secret
        run: docker compose -f docker-compose.secure.yml up -d
      - name: Verify 100/100 ACKs in node_a logs
        run: |
          for i in $(seq 1 60); do
            if docker logs lapinbeam_secure_node_a 2>&1 | grep -q "Total: 100"; then
              echo "E2E OK: node_a received 100 ACKs with cluster_secret set"
              exit 0
            fi
            sleep 2
          done
          echo "E2E FAILED: node_a did not receive 100 ACKs"
          docker logs lapinbeam_secure_node_a
          docker logs lapinbeam_secure_node_b
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.secure.yml down

  docker-e2e-restart:
    name: docker compose e2e (peer restart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose -f docker-compose.restart.yml build
      - name: Start two-node cluster
        run: docker compose -f docker-compose.restart.yml up -d
      - name: Let node_a make some early progress
        run: sleep 5
      - name: Restart node_b mid-stream
        run: docker compose -f docker-compose.restart.yml restart node_b
      - name: Verify node_a reconnects and delivery resumes
        run: |
          # Message loss during the outage window is expected (no
          # at-least-once delivery — see docs/index.md's Limitations), so
          # this checks for substantial recovery, not an exact count: if
          # node_a never reconnected, progress would freeze wherever it was
          # when node_b's container went down instead of climbing back
          # toward the full 40.
          for i in $(seq 1 60); do
            total=$(docker logs lapinbeam_restart_node_a 2>&1 | grep -o "Total: [0-9]*" | tail -1 | grep -o "[0-9]*" || echo 0)
            if [ "$total" -ge 30 ]; then
              echo "E2E OK: node_a recovered and reached Total: $total after node_b's restart"
              exit 0
            fi
            sleep 2
          done
          echo "E2E FAILED: node_a did not recover after node_b's restart"
          docker logs lapinbeam_restart_node_a
          docker logs lapinbeam_restart_node_b
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.restart.yml down
