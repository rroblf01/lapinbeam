name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on the same branch/PR supersedes whatever CI run is already in
# flight for it — cancel the stale one instead of burning minutes on results
# nobody will read. Different branches/PRs get their own group, so they never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build extension and install deps
        run: uv sync
        env:
          PYO3_PYTHON: python3
      - name: Run Python tests
        run: uv run pytest

  # Rust results don't depend on the Python version, so this runs once
  # instead of once per matrix entry above.
  rust-checks:
    name: rust fmt/clippy/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test
        env:
          PYO3_PYTHON: python3

  # mypy only needs to read lapinbeam/'s source + its _core.pyi stub, not the
  # compiled extension — no Rust toolchain or `uv sync` build needed here.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: mypy
        run: uv run --with mypy --no-project -- mypy lapinbeam/

  build-wheels:
    name: build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build abi3 wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Builds and strict-validates the docs on every push/PR — a broken doc
  # link or i18n config used to only surface after merging to main, since
  # `mkdocs build` only ever ran as part of the deploy-to-Pages job below.
  docs-validate:
    name: build & validate docs
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install docs dependencies
        run: uv sync --group docs
      - name: Build site
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  docs-deploy:
    name: deploy docs
    needs: [docs-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-e2e:
    name: docker compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start two-node cluster
        run: docker compose up -d
      - name: Verify 100/100 ACKs in node_a logs
        run: |
          for i in $(seq 1 60); do
            if docker logs lapinbeam_node_a 2>&1 | grep -q "Total: 100"; then
              echo "E2E OK: node_a received 100 ACKs"
              exit 0
            fi
            sleep 2
          done
          echo "E2E FAILED: node_a did not receive 100 ACKs"
          docker logs lapinbeam_node_a
          docker logs lapinbeam_node_b
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down
