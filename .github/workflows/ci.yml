name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on the same branch/PR supersedes whatever CI run is already in
# flight for it — cancel the stale one instead of burning minutes on results
# nobody will read. Different branches/PRs get their own group, so they never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build extension and install deps
        run: uv sync
        env:
          PYO3_PYTHON: python3
      - name: Run Python tests
        run: uv run pytest
      - name: Run Rust tests
        run: cargo test
        env:
          PYO3_PYTHON: python3

  build-wheels:
    name: build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build abi3 wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: build & deploy docs
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install docs dependencies
        run: uv sync --group docs
      - name: Build site
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-e2e:
    name: docker compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start two-node cluster
        run: docker compose up -d
      - name: Verify 100/100 ACKs in node_a logs
        run: |
          for i in $(seq 1 60); do
            if docker logs lapinbeam_node_a 2>&1 | grep -q "Total: 100"; then
              echo "E2E OK: node_a received 100 ACKs"
              exit 0
            fi
            sleep 2
          done
          echo "E2E FAILED: node_a did not receive 100 ACKs"
          docker logs lapinbeam_node_a
          docker logs lapinbeam_node_b
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down
