name: publish

on:
  release:
    types: [published]

jobs:
  # ── Run tests before publishing ────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run Python tests
        run: uv run pytest --tb=short -q

      - name: Run Rust tests
        run: cargo test

  # ── Build source distribution and wheel ───────────────────────────────────
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── Install the actual built wheel and smoke-test it — this is the exact
  #    artifact that reaches PyPI, distinct from the maturin-develop/editable
  #    build the `test` job above exercises ─────────────────────────────────
  smoke-test:
    name: Smoke-test built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the built wheel
        run: pip install dist/*.whl

      - name: Smoke-import the installed wheel
        # Run outside the checked-out source tree: with the repo (and its
        # ./lapinbeam/ source folder) as the working directory, `import
        # lapinbeam` resolves to that folder before site-packages — it has
        # no compiled `_core` extension, so it's not the wheel we just
        # installed, just a same-named folder that happens to shadow it.
        run: |
          cd "$(mktemp -d)"
          python -c "import lapinbeam; print('lapinbeam', lapinbeam.__version__)"

      - name: Run the Python test suite against the installed wheel
        # Same shadowing risk as above — run from tests-python/, which has
        # no lapinbeam/ subfolder of its own, so `import lapinbeam` in the
        # test files resolves to site-packages instead of the repo root.
        working-directory: tests-python
        run: |
          pip install pytest pytest-asyncio pydantic
          pytest --tb=short -q

  # ── Publish to PyPI via Trusted Publisher (no token needed) ───────────────
  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi          # matches the environment configured on PyPI
    permissions:
      id-token: write          # required for OIDC (Trusted Publisher)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
