name: publish

on:
  release:
    types: [published]

jobs:
  # ── Run tests before publishing ────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run Python tests
        run: uv run pytest --tb=short -q

      - name: Run Rust tests
        run: cargo test

  # ── Build wheels — one job per OS family, matching the platforms maturin
  #    itself generates CI for (`maturin generate-ci github`), since none of
  #    this can be exercised or verified from this (Linux) dev machine ───────
  build-linux:
    name: build wheel (linux x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Plain `uv build`/`maturin build` on a bare ubuntu-latest runner tags
      # the wheel "linux_x86_64" — PyPI rejects that tag outright, since it
      # isn't guaranteed portable across distros. This builds inside the
      # manylinux Docker image maturin-action selects, producing a wheel
      # tagged "manylinux_2_17_x86_64" that PyPI actually accepts.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2_17
          args: --release --out dist

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: dist/

  build-macos:
    name: build wheel (macos ${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel # x86_64 (Intel)
            target: x86_64
          - runner: macos-latest # aarch64 (Apple Silicon)
            target: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/

  build-windows:
    name: build wheel (windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: dist/

  # ── Install each actual built wheel, on the OS it was built for, and
  #    smoke-test it — this is the exact artifact that reaches PyPI, distinct
  #    from the maturin-develop/editable build the `test` job above exercises
  smoke-test:
    name: smoke-test wheel (${{ matrix.os }})
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux
          - os: macos-15-intel
            artifact: wheels-macos-x86_64
          - os: macos-latest
            artifact: wheels-macos-aarch64
          - os: windows-latest
            artifact: wheels-windows
    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the built wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Smoke-import the installed wheel
        # Run outside the checked-out source tree: with the repo (and its
        # ./lapinbeam/ source folder) as the working directory, `import
        # lapinbeam` resolves to that folder before site-packages — it has
        # no compiled `_core` extension, so it's not the wheel we just
        # installed, just a same-named folder that happens to shadow it.
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -c "import lapinbeam; print('lapinbeam', lapinbeam.__version__)"

      - name: Run the Python test suite against the installed wheel
        # Same shadowing risk as above — run from tests-python/, which has
        # no lapinbeam/ subfolder of its own, so `import lapinbeam` in the
        # test files resolves to site-packages instead of the repo root.
        working-directory: tests-python
        shell: bash
        run: |
          pip install pytest pytest-asyncio pydantic
          pytest --tb=short -q

  # ── Publish to PyPI via Trusted Publisher (no token needed) ───────────────
  publish:
    name: Publish to PyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: publish       # must match the "Environment name" set on PyPI's trusted publisher config exactly
    permissions:
      id-token: write          # required for OIDC (Trusted Publisher)

    steps:
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
