[package]
name = "lapinbeam"
version = "1.0.3"
edition = "2021"
description = "PyO3 Rust core for lapinbeam: real-time distributed actors"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables pyo3/extension-module. maturin activates it when building the wheel;
# it is left disabled for `cargo test` so tests can link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
