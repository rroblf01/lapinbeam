services:
  postgres:
    image: postgres:16-alpine
    container_name: investigation_stream_postgres
    environment:
      - POSTGRES_USER=investigator
      - POSTGRES_PASSWORD=investigator
      - POSTGRES_DB=investigations
    networks:
      - investigation-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d investigations"]
      interval: 2s
      timeout: 2s
      retries: 20
    # No named volume on purpose: this is a throwaway demo/benchmark
    # environment, torn down and rebuilt between test runs.
    tmpfs:
      - /var/lib/postgresql/data

  worker:
    build: ./worker
    container_name: investigation_stream_worker
    environment:
      - NODE_NAME=worker@worker:9001
      - DATABASE_URL=postgresql://investigator:investigator@postgres:5432/investigations
      - MAX_PARALLEL=${MAX_PARALLEL:-200}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investigation-net
    # NODE_NAME's host is also the interface the listener binds to, so
    # the healthcheck has to dial that same name, not `localhost` (see
    # docs/index.md's "Security" note in the main project).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('worker', 9001), timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: ./app
    container_name: investigation_stream_app
    environment:
      - NODE_NAME=app@app:9000
      - WORKER_NODE=worker@worker:9001
      - DATABASE_URL=postgresql://investigator:investigator@postgres:5432/investigations
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - investigation-net

networks:
  investigation-net:
    driver: bridge
