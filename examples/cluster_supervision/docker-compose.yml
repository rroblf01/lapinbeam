services:
  worker1:
    build: ./worker
    container_name: cluster_supervision_worker1
    environment:
      - NODE_NAME=worker1@worker1:9101
      - CRASH_AFTER=3
    networks:
      - cluster-net
    # NODE_NAME's host is also the interface the listener binds to, so the
    # healthcheck has to dial that same name, not `localhost` (see
    # docs/index.md's "Security" note in the main project).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('worker1', 9101), timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 20

  worker2:
    build: ./worker
    container_name: cluster_supervision_worker2
    environment:
      - NODE_NAME=worker2@worker2:9102
      - CRASH_AFTER=6
    networks:
      - cluster-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('worker2', 9102), timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 20

  hub:
    build: ./hub
    container_name: cluster_supervision_hub
    environment:
      - NODE_NAME=hub@hub:9100
      - WORKERS=worker1@worker1:9101,worker2@worker2:9102
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    networks:
      - cluster-net

networks:
  cluster-net:
    driver: bridge
