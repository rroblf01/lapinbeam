services:
  node_a:
    build: .
    container_name: lapinbeam_restart_node_a
    command: python e2e_restart_node_a.py
    environment:
      - NODE_NAME=node_a@node_a:9001
      - PEER=node_b@node_b:9002
    ports:
      - "9021:9001"
    networks:
      - lapinbeam-restart-net

  node_b:
    build: .
    container_name: lapinbeam_restart_node_b
    command: python e2e_restart_node_b.py
    environment:
      - NODE_NAME=node_b@node_b:9002
      - PEER=node_a@node_a:9001
    ports:
      - "9022:9002"
    networks:
      - lapinbeam-restart-net

networks:
  lapinbeam-restart-net:
    driver: bridge
