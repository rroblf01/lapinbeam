[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "lapinbeam"
version = "1.0.0"
description = "Real-time distributed systems framework for Python with a Rust core (actor model, multiplexed TCP transport)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "lapinbeam contributors" }]
keywords = ["actors", "distributed", "realtime", "tokio", "pyo3", "message-passing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rroblf01/lapinbeam"
Repository = "https://github.com/rroblf01/lapinbeam"
Issues = "https://github.com/rroblf01/lapinbeam/issues"
Documentation = "https://rroblf01.github.io/lapinbeam/"
Changelog = "https://github.com/rroblf01/lapinbeam/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pydantic>=2.0",
    "maturin>=1.12,<2.0",
    "mypy>=2.3.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
]

[tool.maturin]
module-name = "lapinbeam._core"
features = ["extension-module"]
python-source = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests-python"]
addopts = "-q"
