services:
  node_a:
    build: .
    container_name: lapinbeam_secure_node_a
    command: python app_node_a.py
    environment:
      - NODE_NAME=node_a@node_a:9001
      - PEER=node_b@node_b:9002
      - CLUSTER_SECRET=e2e-test-shared-secret
    ports:
      - "9011:9001"
    networks:
      - lapinbeam-secure-net

  node_b:
    build: .
    container_name: lapinbeam_secure_node_b
    command: python app_node_b.py
    environment:
      - NODE_NAME=node_b@node_b:9002
      - PEER=node_a@node_a:9001
      - CLUSTER_SECRET=e2e-test-shared-secret
    ports:
      - "9012:9002"
    networks:
      - lapinbeam-secure-net

networks:
  lapinbeam-secure-net:
    driver: bridge
